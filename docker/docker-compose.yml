# Optional local object storage (MinIO, S3-compatible) for the faceless AI-history pipeline —
# e.g. storing generated images / rendered videos at scale. NOT required for the Tier-0 PoC
# (which writes to result/ locally). Postgres + Redis were removed (the new pipeline uses neither).
# Start when needed:  docker compose -f docker/docker-compose.yml up -d
# Volume starts EMPTY (old data was wiped). Credentials mirror .env (S3_*).
name: faceless-ai-history

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
